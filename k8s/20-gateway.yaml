apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: harvestledger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          # Built locally and loaded into the cluster (e.g. `kind load
          # docker-image harvestledger-gateway:latest`); not pulled from a registry.
          image: harvestledger-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: harvestledger-config
            - secretRef:
                name: harvestledger-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: harvestledger
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: harvestledger
  annotations:
    # Uploads pass through the gateway to S3/MinIO; bound them at the edge.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Edge rate limit: the gateway's ThrottlerModule counts per pod (100
    # req/min), so with 2-6 replicas the effective ceiling is 200-600 req/min.
    # This caps it at the edge regardless of replica count.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    cert-manager.io/issuer: harvestledger-selfsigned
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - harvestledger.local
      secretName: gateway-tls
  rules:
    - host: harvestledger.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: harvestledger
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
