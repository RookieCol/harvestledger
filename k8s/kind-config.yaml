# kind cluster config for HarvestLedger. Maps host 80/443 onto the node that
# carries the ingress-ready label, so the ingress-nginx controller (deployed
# as a NodePort/hostPort DaemonSet in kind's own manifest) is reachable at
# https://harvestledger.local without a cloud LoadBalancer.
#
# Usage: kind create cluster --name harvestledger --config k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
