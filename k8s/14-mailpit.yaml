# SMTP sink for the lab cluster. `notifications` needs somewhere to deliver,
# and a real provider has no place in a throwaway kind cluster — Mailpit
# accepts everything and shows it in a web UI:
#   kubectl -n harvestledger port-forward svc/mailpit 8025:8025
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: harvestledger
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: harvestledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          ports:
            - containerPort: 1025
            - containerPort: 8025
          readinessProbe:
            httpGet:
              path: /
              port: 8025
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
