apiVersion: v1
kind: Service
metadata:
  name: postgres-farms
  namespace: harvestledger
spec:
  selector:
    app: postgres-farms
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-farms
  namespace: harvestledger
spec:
  serviceName: postgres-farms
  replicas: 1
  selector:
    matchLabels:
      app: postgres-farms
  template:
    metadata:
      labels:
        app: postgres-farms
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "user"
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: POSTGRES_DB
              value: "harvestledger_farms"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "user", "-d", "harvestledger_farms"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
