version: "3"
services:
  gateway:
    build:
      context: ./
      dockerfile: ./apps/gateway/Dockerfile
    ports:
      - "8086:5000"
    volumes:
      - .:/usr/src/app # any change to base folder should be reflected
      - /usr/src/app/node_modules
    command: pnpm run start:dev api

  auth:
    build:
      context: ./
      dockerfile: ./apps/auth/Dockerfile
    depends_on:
      - rabbitmq
      - postgres
    volumes:
      - .:/usr/src/app # any change to base folder should be reflected
      - /usr/src/app/node_modules
    command: pnpm run start:dev auth

  farms:
    build:
      context: ./
      dockerfile: ./apps/farms/Dockerfile
    depends_on:
      - gateway
      - rabbitmq
      - postgres
    volumes:
      - .:/usr/src/app # any change to base folder should be reflected
      - /usr/src/app/node_modules
    command: pnpm run start:dev farms

  rabbitmq:
    image: "rabbitmq:management-alpine"
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Web management console
    env_file:
      - .env

  postgres:
    image: "postgres:latest"
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
  
  postgres_admin:
    image: dpage/pgadmin4
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - '15432:80'

