version: "3"
services:
  rabbitmq:
    image: "rabbitmq:management-alpine"
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Web management console
    env_file:
      - .env

  gateway:
    depends_on:
      - rabbitmq

    build:
      context: ./
      dockerfile: ./apps/gateway/Dockerfile
    ports:
      - "8086:5000"
    volumes:
      - .:/usr/src/app # any change to base folder should be reflected
      - /usr/src/app/node_modules
    command: pnpm run start:dev gateway

  auth:
    build:
      context: ./
      dockerfile: ./apps/auth/Dockerfile
    depends_on:
      - rabbitmq
      - postgres
      - minio
    volumes:
      - .:/usr/src/app # any change to base folder should be reflected
      - /usr/src/app/node_modules
    command: pnpm run start:dev auth

  farms:
    build:
      context: ./
      dockerfile: ./apps/farms/Dockerfile
    depends_on:
      - gateway
      - rabbitmq
      - postgres
      - minio
    volumes:
      - .:/usr/src/app # any change to base folder should be reflected
      - /usr/src/app/node_modules
    command: pnpm run start:dev farms

  tracing:
    build:
      context: ./
      dockerfile: ./apps/tracing/Dockerfile
    depends_on:
      - rabbitmq
      - mongo
    volumes:
      - .:/usr/src/app # any change to base folder should be reflected
      - /usr/src/app/node_modules
    command: pnpm run start:dev tracing # overrides CMD from dockerfile

  postgres:
    image: "postgres:latest"
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data

  postgres_admin:
    image: dpage/pgadmin4
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - '15432:80'

  mongo:
    image: "mongo:7"
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db

  redis:
    image: "redis:7-alpine"
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data

  minio:
    image: "minio/minio"
    container_name: minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - ./minio_data:/data

  minio_createbucket:
    image: "minio/mc"
    depends_on:
      - minio
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY}) do echo 'waiting for minio...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/$${S3_BUCKET};
      exit 0;
      "
