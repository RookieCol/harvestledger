# Default values for the harvestledger chart.

imageRepoPrefix: harvestledger # images: <prefix>-<app>:<tag>
imageTag: latest
imagePullPolicy: IfNotPresent

# Non-secret configuration (rendered into a ConfigMap). In-cluster hostnames are
# the backend Service names below.
config:
  RABBITMQ_HOST: "rabbitmq:5672"
  RABBITMQ_AUTH_QUEUE: "auth_queue"
  RABBITMQ_FARMS_QUEUE: "farms_queue"
  RABBITMQ_TRACING_QUEUE: "tracing_queue"
  RABBITMQ_NOTIFICATIONS_QUEUE: "notifications_queue"
  MONGO_URI: "mongodb://mongo:27017/harvestledger"
  REDIS_URL: "redis://redis:6379"
  S3_REGION: "us-east-1"
  S3_BUCKET: "harvestledger-bucket"
  S3_ENDPOINT: "http://minio:9000"
  HEALTH_PORT: "3000"
  CORS_ORIGINS: "http://localhost:3000"
  # Default: services do not migrate. `migrationsWorkers` overrides this per worker.
  DB_RUN_MIGRATIONS: "false"

# Secret values (rendered into a Secret). PLACEHOLDERS — override with
# `--set secret.JWT_SECRET=...` or a values file kept out of git.
secret:
  RABBITMQ_USER: "user"
  RABBITMQ_PASS: "password"
  JWT_SECRET: "replace_with_a_random_value"
  JWT_REFRESH_SECRET: "replace_with_another_random_value"
  S3_ACCESS_KEY_ID: "minioadmin"
  S3_SECRET_ACCESS_KEY: "minioadmin123"

gateway:
  replicas: 2
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  ingress:
    enabled: true
    className: nginx
    host: harvestledger.local
    # Uploads pass through the gateway to S3/MinIO; bound them at the edge.
    bodySize: 10m
    readTimeout: 60
    sendTimeout: 60
    # The gateway's ThrottlerModule counts per pod (100 req/min); with
    # 2-6 replicas the effective ceiling is 200-600 req/min. This caps it at
    # the edge regardless of replica count.
    rateLimit:
      rps: 20
      connections: 20
    tls:
      enabled: true
      secretName: gateway-tls
      issuer: harvestledger-selfsigned

# The RabbitMQ-only workers. Same shape; only the name differs.
workers:
  - auth
  - farms
  - tracing
  - notifications

# Which workers run their own DB migrations on startup. Each now owns its own
# database, so both can safely migrate — this is no longer about avoiding a
# race, just an explicit opt-in list. Set to [] to disable in-app migrations
# entirely (run them out-of-band).
migrationsWorkers:
  - auth
  - farms

# Per-worker Postgres connection info — only workers listed here get a
# connection-string env var injected (see workers.yaml).
postgres:
  auth:
    envKey: AUTH_POSTGRES_URI
    uri: "postgresql://user:password@postgres-auth:5432/harvestledger_auth"
    db: "harvestledger_auth"
  farms:
    envKey: FARMS_POSTGRES_URI
    uri: "postgresql://user:password@postgres-farms:5432/harvestledger_farms"
    db: "harvestledger_farms"

workerResources:
  requests: { cpu: "100m", memory: "128Mi" }
  limits: { cpu: "500m", memory: "256Mi" }

# Stateful backends. Disable any of these to point at an external instance.
backends:
  postgresAuth:
    enabled: true
    image: postgres:16
    storage: 1Gi
  postgresFarms:
    enabled: true
    image: postgres:16
    storage: 1Gi
  mongo:
    enabled: true
    image: mongo:7
    storage: 1Gi
  redis:
    enabled: true
    image: redis:7-alpine
    storage: 512Mi
  rabbitmq:
    enabled: true
    image: rabbitmq:3-management-alpine
    storage: 1Gi
