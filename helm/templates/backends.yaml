# One Postgres per service: auth and farms each own their database, so
# there is no shared instance and no cross-service join.
{{- if .Values.backends.postgresAuth.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth
spec:
  selector: { app: postgres-auth }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-auth
spec:
  serviceName: postgres-auth
  replicas: 1
  selector:
    matchLabels: { app: postgres-auth }
  template:
    metadata:
      labels: { app: postgres-auth }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.backends.postgresAuth.image }}
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRES_USER, value: "user" }
            - { name: POSTGRES_PASSWORD, value: "password" }
            - { name: POSTGRES_DB, value: "harvestledger_auth" }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "user", "-d", "harvestledger_auth"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.backends.postgresAuth.storage }}
{{- end }}
